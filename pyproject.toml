[project]
name = "friendlywords"
dynamic = ["version"]
description = "Python package to generate random human-readable strings, e.g. project and experiment names"
authors = [
    {name = "the-lay", email = "ilja.gubin@gmail.com"},
]
dependencies = []
requires-python = ">=3.9"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.urls]
Source = "https://github.com/the-lay/py-friendly-words"
Issues = "https://github.com/the-lay/py-friendly-words/issues"

[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
friendlywords = ["data/*", "py.typed", "__init__.pyi"]

[tool.mypy]
python_version = "3.9"

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
select = ["E", "I", "F", "W", "B", "A"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
